[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
